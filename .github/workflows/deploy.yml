# Test on every PR; deploy on push: dev branch -> dev account, main -> prod.
#
# One pipeline for both halves of the operator console:
#   web/ -> S3 bucket + CloudFront invalidation
#   api/ -> arm64 image in the platform-tenants ECR repo -> Lambda update
#
# Per-environment values are GitHub *environment variables* (Settings ->
# Environments -> dev / prod), all non-secret, all from `tofu output` in the
# infrastructure repo - see README "Deploy".
name: sbs-admin

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: API tests
        working-directory: api
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web typecheck + build
        working-directory: web
        env:
          VITE_API_URL: https://example.invalid
          VITE_COGNITO_AUTHORITY: https://example.invalid
          VITE_COGNITO_CLIENT_ID: ci
          VITE_COGNITO_DOMAIN: https://example.invalid
        run: |
          npm ci
          npm run build

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    permissions:
      id-token: write   # OIDC -> platform-admin-front-end-deploy-role
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ---------- API (platform-tenants Lambda) ----------
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push API image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/arm64
          push: true
          provenance: false   # Lambda needs a single-arch image manifest, not an index
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
      - name: Update Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --image-uri "${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}" >/dev/null
          aws lambda wait function-updated-v2 --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"

      # ---------- Web app ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web
        working-directory: web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_COGNITO_AUTHORITY: ${{ vars.VITE_COGNITO_AUTHORITY }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_PLATFORM_DOMAIN: ${{ vars.VITE_PLATFORM_DOMAIN }}
          VITE_ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
        run: |
          npm ci
          npm run build
      - name: Publish web (hashed assets first, index.html last)
        working-directory: web
        run: |
          aws s3 sync dist/ "s3://${{ vars.WEB_BUCKET }}/" --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${{ vars.WEB_BUCKET }}/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/index.html" >/dev/null